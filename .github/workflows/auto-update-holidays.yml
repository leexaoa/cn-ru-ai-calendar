name: Auto Update Holidays

# 定时自动运行：每周一上午 8 点（UTC）
on:
  schedule:
    - cron: '0 8 * * 1'  # 周一 8:00 UTC
  
  # 也可以手动触发
  workflow_dispatch:

jobs:
  update-holidays:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Fetch and update holiday data
        run: python scripts/update_holidays.py
      
      - name: Generate calendar
        run: python generate.py
      
      - name: Check for changes
        id: verify
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.verify.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: Auto update holiday data and calendar - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
      
      - name: No changes detected
        if: steps.verify.outputs.has_changes == 'false'
        run: echo "No holiday data changes detected"
